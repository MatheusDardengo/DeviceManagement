services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devicemanagement_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SenhaForte!2026
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "SenhaForte!2026", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: DeviceManagement.Api/Dockerfile
    container_name: devicemanagement_api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=DeviceDb;User Id=sa;Password=SenhaForte!2026;TrustServerCertificate=True;
    depends_on:
      db:
        condition: service_healthy